name: Build & Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE: ${{ github.sha }}
  GLITCHTIP_DIST_DIR: .tmp/glitchtip-dist

jobs:
  build-and-push:
    name: Build, upload sourcemaps & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Validate GlitchTip sourcemap configuration
        env:
          GLITCHTIP_URL: ${{ secrets.GLITCHTIP_URL }}
          GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          GLITCHTIP_ORG: ${{ secrets.GLITCHTIP_ORG }}
          GLITCHTIP_PROJECT: ${{ secrets.GLITCHTIP_PROJECT }}
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
          VITE_GLITCHTIP_RELEASE: ${{ env.RELEASE }}
        run: bash ./sh/glitchtip-cli.sh validate-config

      - name: Export production dist for GlitchTip sourcemaps
        uses: docker/build-push-action@v5
        with:
          context: .
          target: dist-assets
          outputs: type=local,dest=${{ env.GLITCHTIP_DIST_DIR }}
          build-args: |
            VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}
            VITE_BASE_API_URL=${{ secrets.VITE_BASE_API_URL }}
            VITE_GLITCHTIP_DSN=${{ secrets.VITE_GLITCHTIP_DSN }}
            VITE_GLITCHTIP_ENVIRONMENT=production
            VITE_GLITCHTIP_RELEASE=${{ env.RELEASE }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install GlitchTip CLI
        shell: bash
        run: cargo install --git https://gitlab.com/glitchtip/glitchtip-cli.git glitchtip-cli

      - name: Upload GlitchTip sourcemaps
        env:
          GLITCHTIP_URL: ${{ secrets.GLITCHTIP_URL }}
          GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          GLITCHTIP_ORG: ${{ secrets.GLITCHTIP_ORG }}
          GLITCHTIP_PROJECT: ${{ secrets.GLITCHTIP_PROJECT }}
          RELEASE: ${{ env.RELEASE }}
        run: bash ./sh/glitchtip-cli.sh upload-sourcemaps "${{ env.GLITCHTIP_DIST_DIR }}/app" "$RELEASE"

      - name: Build and push injected GlitchTip dist
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prebuilt-dist
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PREBUILT_DIST_DIR=${{ env.GLITCHTIP_DIST_DIR }}/app

      - name: Record GlitchTip deploy
        env:
          GLITCHTIP_URL: ${{ secrets.GLITCHTIP_URL }}
          GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          GLITCHTIP_ORG: ${{ secrets.GLITCHTIP_ORG }}
          GLITCHTIP_PROJECT: ${{ secrets.GLITCHTIP_PROJECT }}
          RELEASE: ${{ env.RELEASE }}
        run: bash ./sh/glitchtip-cli.sh record-deploy "$RELEASE" production

  deploy:
    name: Trigger Dokploy deployment
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Trigger Dokploy deployment
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_API_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          service_type: application
