server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (применяются ко всем location-блокам)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # SPA routing — все маршруты перенаправляются на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA: SW и manifest не кэшируем — клиент должен всегда получать свежую версию
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[a-f0-9]+\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Статические ассеты с content-hash в имени — кэшируем на год
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sourcemaps are uploaded to GlitchTip during CI and must not be public.
    location ~* \.map$ {
        return 404;
    }

    # index.html — никогда не кэшируем
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
